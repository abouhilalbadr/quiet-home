# Quiet Home settings
#
# Change a line, save, then rebuild and reinstall:
#   sh build.sh && sh install.sh <TV_IP>
#
# One setting per line: name = value. Lines starting with # are notes and are ignored.
# Lists are separated by commas. Leave a value empty to turn that thing off.
# Not sure what to write? Ask your AI agent: "Change <thing> in settings.conf to <what you want>."

# ── The app ───────────────────────────────────────────────────────────────

# The name Android shows for this home screen.
name = Quiet Home

# The app's ID on the TV. Keep it the same so new builds update the app you already have.
# Change it only to install a second, separate copy.
app_id = com.abouhilalbadr.quiethome

# ── Top row: your apps ────────────────────────────────────────────────────

# Package names, in order. Apps that aren't on your TV are skipped.
# Not sure of a package name? Ask your agent: "What's the package name of <app> on my TV?"
apps = com.google.android.youtube.tv, com.netflix.ninja, com.amazon.amazonvideo.livingroom, com.disney.disneyplus, com.hulu.livingroomplus, com.wbd.stream

# yes: while the list has fewer than six apps on your TV, add other TV apps you installed.
# no: show only the apps listed above.
add_other_apps = yes

# Custom tile art: put a 16:9 PNG named after the app's package in tiles/,
# for example tiles/com.netflix.ninja.png. It replaces that app's own banner.

# ── Bottom row ────────────────────────────────────────────────────────────

# In this order, six tiles at most. Remove any you don't want.
#   play_store   Google Play (left out if it's already in your top row)
#   inputs       your TV's HDMI inputs, as many as fit
#   settings     Android settings
#   background   shows the next background picture
#   add_app      pick an app to add to the top row
bottom_row = play_store, inputs, settings, background, add_app

# ── Top right, next to the clock ──────────────────────────────────────────

# Settings shortcuts, in order: any of bluetooth, sound, picture. Empty for none.
shortcuts =

# yes: an icon that shows Wi-Fi, Ethernet or offline, and opens network settings.
network_icon = yes

# ── Clock ─────────────────────────────────────────────────────────────────

# auto (follows the TV's 12/24-hour setting), 12h, 24h, or off.
clock = auto

# The line above the clock. EEEE = day name, d = day, MMMM = month name, MMM = short month,
# yyyy = year. For example "EEE d MMM" shows "Tue 4 Nov". Empty for no date.
date = EEEE, d MMMM

# ── Look ──────────────────────────────────────────────────────────────────

# The colour of the glow behind whatever is selected, of menus, and of the outline while moving an app.
# A colour code like #FFFFFF (white). Quiet Home's own yellow is #FFD166.
accent = #FFFFFF

# Background pictures from the backgrounds/ folder:
#   all     every picture in the folder, in name order
#   none    no pictures, a plain dark background
#   or file names in the order to show them.
# Add your own: put a 1920x1080 JPG in backgrounds/ (keep it dark behind the clock and apps).
backgrounds = dusk.jpg, moon-trees.jpg, pagoda.jpg, lake-house.jpg, boat.jpg, canyon.jpg, sakura.jpg, peaks.jpg, lanterns.jpg, hiker.jpg, red-sun.jpg

# daily: a new picture every day. fixed: stay on one until you press the Background tile.
background_change = daily
